    <text x="56" y="188" fill="#101720" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="0">GIS / GeoAI</text>
    <text x="56" y="264" fill="#101720" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="0">Systems Builder</text>
    <text x="56" y="336" fill="#314a45" font-family="Inter, Arial, sans-serif" font-size="28" letter-spacing="0">Maps, data workflows, AI automation,</text>
    <text x="56" y="376" fill="#314a45" font-family="Inter, Arial, sans-serif" font-size="28" letter-spacing="0">and shipped product proof.</text>
    <rect x="56" y="414" width="310" height="50" rx="25" fill="#17352f"/>
