  <path d="M0 480 C180 410 270 520 430 454 C610 380 710 224 895 260 C1020 284 1094 372 1200 326 L1200 630 L0 630 Z" fill="#101720" fill-opacity="0.42"/>
  <g fill="none" stroke="#f8f3e7" stroke-opacity="0.35" stroke-width="3">
    <path d="M820 128 L990 168 L1070 296 L934 394 L768 346 L712 214 Z"/>
    <path d="M820 128 L934 394"/>
    <path d="M990 168 L768 346"/>
    <path d="M712 214 L1070 296"/>
  </g>
  <g transform="translate(88 86)">
