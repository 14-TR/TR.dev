<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TR Ingram - GIS / GeoAI Systems Builder</title>
  <desc id="desc">A dark social share card for TR Ingram, focused on GIS, GeoAI, maps, automation, and shipped product proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101720"/>
      <stop offset="0.55" stop-color="#17352f"/>
      <stop offset="1" stop-color="#f2c14e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3e7" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#e8f0df" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f8f3e7" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
